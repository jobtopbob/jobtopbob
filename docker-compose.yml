# JobTopBob — single Compose file for dev and production.
#
# Profiles are controlled by COMPOSE_PROFILES in .env (set once, use everywhere):
#   (unset)       → infrastructure only (Postgres, Redis, etc.) for local dev
#   prod          → infrastructure + app services (web, api, worker)
#   prod,scrapers → everything including job discovery scrapers
#
# Usage (same for up, down, logs, etc.):
#   docker compose up -d
#   docker compose down
#
# Dev URLs:
#   PostgreSQL:      localhost:5432
#   Redis:           localhost:6379
#   Resume Builder:  localhost:3010
#   Asynq Inspector: localhost:8081
#
# Prod URLs (when COMPOSE_PROFILES=prod):
#   Frontend:        localhost:3000
#   Go API:          localhost:8080
#   Resume Builder:  localhost:3010
#   Asynq Inspector: localhost:8081

services:
  # ---------------------------------------------------------------------------
  # Infrastructure (always runs)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtopbob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-jobtopbob}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-app-role.sh:/docker-entrypoint-initdb.d/01-init-app-role.sh:ro
      - ./docker/postgres/02-init-rxresume.sh:/docker-entrypoint-initdb.d/02-init-rxresume.sh:ro
      - ./docker/postgres/03-init-better-auth.sh:/docker-entrypoint-initdb.d/03-init-better-auth.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtopbob}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Resume builder (RxResume)
  # ---------------------------------------------------------------------------
  resume-builder:
    image: amruthpillai/reactive-resume:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobtopbob}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rxresume
      AUTH_SECRET: ${RXRESUME_AUTH_SECRET:-dev-rxresume-secret-change-me}
      APP_URL: ${RESUME_BUILDER_PUBLIC_URL:-http://localhost:3010}
      PRINTER_APP_URL: http://resume-builder:3000
      PRINTER_ENDPOINT: ${RESUME_PRINTER_ENDPOINT:-ws://resume-printer:3000}
      # Disable local auth — force SSO only
      # Email/password auth is disabled; signups are allowed so OAuth/SSO
      # can auto-create accounts for authenticated JobTopBob users.
      FLAG_DISABLE_EMAIL_AUTH: "true"
      # SSO via JobTopBob's OIDC provider
      OAUTH_PROVIDER_NAME: JobTopBob
      OAUTH_CLIENT_ID: ${RXRESUME_OAUTH_CLIENT_ID:-rxresume}
      OAUTH_CLIENT_SECRET: ${RXRESUME_OAUTH_CLIENT_SECRET:-rxresume-secret}
      # Authorization URL is browser-facing (user's browser navigates here)
      OAUTH_AUTHORIZATION_URL: ${OAUTH_BROWSER_URL:-http://localhost:3000}/api/auth/oauth2/authorize
      # Token + UserInfo URLs are server-to-server (RxResume backend → JobTopBob)
      OAUTH_TOKEN_URL: ${OAUTH_INTERNAL_URL:-http://host.docker.internal:3000}/api/auth/oauth2/token
      OAUTH_USER_INFO_URL: ${OAUTH_INTERNAL_URL:-http://host.docker.internal:3000}/api/auth/oauth2/userinfo
      OAUTH_SCOPES: openid profile email
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RESUME_BUILDER_PORT:-3010}:3000"
    volumes:
      - rxresume_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      resume-printer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  resume-printer:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      HEALTH: "true"
      CONCURRENT: 10
      QUEUED: 5
    ports:
      - "127.0.0.1:${RESUME_PRINTER_HTTP_PORT:-3020}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  asynq-inspector:
    image: hibiken/asynqmon:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${ASYNQ_INSPECTOR_PORT:-8081}:8080"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Application services (prod only — in dev these run on the host)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    profiles: [prod]
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-jobtopbob_app}:${POSTGRES_APP_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-jobtopbob}?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-jobtopbob}?sslmode=disable
      NEXT_PUBLIC_SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    profiles: [prod]
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-jobtopbob_app}:${POSTGRES_APP_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-jobtopbob}?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-jobtopbob}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      API_PORT: "8080"
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY}
      JWKS_URL: http://web:3000/api/auth/jwks
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      RESUME_BUILDER_URL: ${RESUME_BUILDER_URL:-http://resume-builder:3000}
      RESUME_PRINTER_HTTP_URL: http://resume-printer:3000
      RESUME_BUILDER_PRINTER_URL: http://resume-builder:3000
      S3_BUCKET: ${S3_BUCKET:-jobtopbob}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_ENDPOINT: http://rustfs:9000
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    profiles: [prod]
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-jobtopbob_app}:${POSTGRES_APP_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-jobtopbob}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY}
      RESUME_BUILDER_URL: ${RESUME_BUILDER_URL:-http://resume-builder:3000}
      S3_BUCKET: ${S3_BUCKET:-jobtopbob}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      api:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Scraper services (opt-in via --profile scrapers)
  # ---------------------------------------------------------------------------
  scraper-linkedin:
    build:
      context: .
      dockerfile: scrapers/linkedin/Dockerfile
    restart: unless-stopped
    profiles: [scrapers]
    environment:
      PORT: "3000"
      HYPERBROWSER_API_KEY: ${HYPERBROWSER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scraper-indeed:
    build:
      context: .
      dockerfile: scrapers/indeed/Dockerfile
    restart: unless-stopped
    profiles: [scrapers]
    environment:
      PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scraper-glassdoor:
    build:
      context: .
      dockerfile: scrapers/glassdoor/Dockerfile
    restart: unless-stopped
    profiles: [scrapers]
    environment:
      PORT: "3000"
      HYPERBROWSER_API_KEY: ${HYPERBROWSER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scraper-adzuna:
    build:
      context: .
      dockerfile: scrapers/adzuna/Dockerfile
    restart: unless-stopped
    profiles: [scrapers]
    environment:
      PORT: "3000"
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  rxresume_data:
  rustfs_data:
