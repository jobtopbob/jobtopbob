  /api/v1/companies:
    get:
      summary: List companies with pagination, filtering, and sorting
      parameters:
        - name: search
          in: query
          description: Search in name, domain, location, industry
          schema:
            type: string
        - name: industries
          in: query
          description: Comma-separated list of industries to filter by
          schema:
            type: string
        - name: sizes
          in: query
          description: Comma-separated list of company sizes to filter by
          schema:
            type: string
        - name: data_sources
          in: query
          description: Comma-separated list of data sources to filter by (manual, api, scraped, email)
          schema:
            type: string
        - name: enrichment_statuses
          in: query
          description: Comma-separated list of enrichment statuses to filter by (none, pending, enriched, failed)
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, industry, job_count, created_at, updated_at]
            default: name
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated list of companies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CompanyWithJobCount"
    post:
      summary: Create a new company
      description: Deduplicates by domain (primary) and name (secondary). Returns existing company if duplicate found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/companies/search:
    get:
      summary: Search companies by name or domain
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (matches against name and domain)
      responses:
        "200":
          description: Matching companies (max 20)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "400":
          description: Missing query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

