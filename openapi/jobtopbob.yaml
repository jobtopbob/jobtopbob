openapi: 3.1.0
info:
  title: JobTopBob API
  version: 0.0.2
  description: JobTopBob API server

servers:
  - url: http://localhost:8080
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by Better Auth, validated via JWKS

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PaginatedResponse:
      type: object
      required: [data, total, page, per_page]
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer

    Job:
      type: object
      required: [id, user_id, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
          nullable: true
        stage_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        status:
          type: string
          nullable: true
        close_reason:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        location_type:
          type: string
          nullable: true
        salary_min:
          type: integer
          nullable: true
        salary_max:
          type: integer
          nullable: true
        salary_market:
          type: integer
          nullable: true
        salary_currency:
          type: string
          nullable: true
        interest:
          type: integer
          nullable: true
        suitability:
          type: integer
          nullable: true
        suitability_reason:
          type: string
          nullable: true
        resume_version_id:
          type: string
          format: uuid
          nullable: true
        jd_raw:
          type: string
          nullable: true
        jd_snapshot:
          type: object
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
        follow_up_at:
          type: string
          format: date-time
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        job_type:
          type: string
          nullable: true
        job_level:
          type: string
          nullable: true
        salary_interval:
          type: string
          nullable: true
        application_url:
          type: string
          nullable: true
        experience_range:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        company_name:
          type: string
          nullable: true
          description: Joined from companies table
        company_logo_url:
          type: string
          nullable: true
          description: Company logo URL from storage
        stage_name:
          type: string
          nullable: true
          description: Joined from stages table
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    Stage:
      type: object
      required: [id, user_id, name, position, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        is_terminal:
          type: boolean
          nullable: true
        color:
          type: string
          nullable: true
        mapped_status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tag:
      type: object
      required: [id, user_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tagging:
      type: object
      required: [tag_id, entity_type, entity_id, user_id, created_at]
      properties:
        tag_id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    ActivityLogEntry:
      type: object
      required: [id, user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        entity_type:
          type: string
          nullable: true
        entity_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          nullable: true
        old_value:
          type: object
          nullable: true
        new_value:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateJobRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        company_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        status:
          type: string
        source:
          type: string
        source_url:
          type: string
        location:
          type: string
        location_type:
          type: string
        salary_min:
          type: integer
        salary_max:
          type: integer
        salary_currency:
          type: string
        salary_interval:
          type: string
        interest:
          type: integer
        jd_raw:
          type: string
        applied_at:
          type: string
          format: date-time
        follow_up_at:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        job_type:
          type: string
        job_level:
          type: string
        application_url:
          type: string
        experience_range:
          type: string

    UpdateJobRequest:
      type: object
      properties:
        title:
          type: string
        company_id:
          type: string
          format: uuid
          nullable: true
        stage_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          nullable: true
        close_reason:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        location_type:
          type: string
          nullable: true
        salary_min:
          type: integer
          nullable: true
        salary_max:
          type: integer
          nullable: true
        salary_market:
          type: integer
          nullable: true
        salary_currency:
          type: string
          nullable: true
        interest:
          type: integer
          nullable: true
        suitability:
          type: integer
          nullable: true
        suitability_reason:
          type: string
          nullable: true
        resume_version_id:
          type: string
          format: uuid
          nullable: true
        jd_raw:
          type: string
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
        follow_up_at:
          type: string
          format: date-time
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        job_type:
          type: string
          nullable: true
        job_level:
          type: string
          nullable: true
        salary_interval:
          type: string
          nullable: true
        application_url:
          type: string
          nullable: true
        experience_range:
          type: string
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true

    ImportJobRequest:
      type: object
      required: [title, source_url]
      properties:
        title:
          type: string
        source_url:
          type: string
        source:
          type: string
        location:
          type: string
        location_type:
          type: string
        salary_min:
          type: integer
        salary_max:
          type: integer
        salary_currency:
          type: string
        salary_interval:
          type: string
        jd_raw:
          type: string
        company_name:
          type: string
        deadline:
          type: string
          format: date-time
        job_type:
          type: string
        job_level:
          type: string
        application_url:
          type: string
        experience_range:
          type: string

    BulkUpdateRequest:
      type: object
      required: [job_ids]
      properties:
        job_ids:
          type: array
          items:
            type: string
            format: uuid
        stage_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          nullable: true
        delete:
          type: boolean
          description: If true, delete the specified jobs instead of updating

    CreateStageRequest:
      type: object
      required: [name, position]
      properties:
        name:
          type: string
        position:
          type: integer
        is_terminal:
          type: boolean
        color:
          type: string
        mapped_status:
          type: string

    UpdateStageRequest:
      type: object
      properties:
        name:
          type: string
        is_terminal:
          type: boolean
          nullable: true
        color:
          type: string
          nullable: true
        mapped_status:
          type: string
          nullable: true

    ReorderStagesRequest:
      type: object
      required: [stages]
      properties:
        stages:
          type: array
          items:
            type: object
            required: [id, position]
            properties:
              id:
                type: string
                format: uuid
              position:
                type: integer

    Company:
      type: object
      required: [id, user_id, name, data_source, enrichment_status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        name:
          type: string
        domain:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        size:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        founded_year:
          type: integer
          nullable: true
        linkedin_url:
          type: string
          nullable: true
        employee_count:
          type: integer
          nullable: true
        interest:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        data_source:
          type: string
          enum: [manual, api, scraped, email]
        enrichment_status:
          type: string
          enum: [none, pending, enriched, failed]
        last_enriched_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompanyWithJobCount:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            job_count:
              type: integer

    EnrichmentLog:
      type: object
      required: [id, company_id, user_id, provider, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        user_id:
          type: string
        provider:
          type: string
          description: Provider name (e.g. "pdl", "webscrape", "favicon")
        status:
          type: string
          enum: [success, failed, skipped]
        fields_set:
          type: array
          items:
            type: string
          nullable: true
          description: Column names this provider populated
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type: string
        description:
          type: string
        industry:
          type: string
        size:
          type: string
        location:
          type: string
        founded_year:
          type: integer
        linkedin_url:
          type: string
        employee_count:
          type: integer
        interest:
          type: integer
        notes:
          type: string
        logo_url:
          type: string

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        website:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        size:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        founded_year:
          type: integer
          nullable: true
        linkedin_url:
          type: string
          nullable: true
        employee_count:
          type: integer
          nullable: true
        interest:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string

    Resume:
      type: object
      required: [id, name, experience_count, education_count, skills_count, projects_count, certs_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rxresume_id:
          type: string
          nullable: true
        is_base:
          type: boolean
        template:
          type: string
          nullable: true
        headline:
          type: string
          nullable: true
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        picture_url:
          type: string
          nullable: true
        latest_role:
          type: string
          nullable: true
        primary_color:
          type: string
          nullable: true
        experience_count:
          type: integer
          format: int32
        education_count:
          type: integer
          format: int32
        skills_count:
          type: integer
          format: int32
        projects_count:
          type: integer
          format: int32
        certs_count:
          type: integer
          format: int32
        top_skills:
          type: array
          items:
            type: string
          nullable: true
        synced_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateResumeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        template:
          type: string
          enum: [azurill, bronzor, chikorita, ditgar, ditto, gengar, glalie, kakuna, lapras, leafish, onyx, pikachu, rhyhorn]
        with_sample_data:
          type: boolean

    SyncResumesResponse:
      type: object
      required: [resumes, sync_status]
      properties:
        resumes:
          type: array
          items:
            $ref: "#/components/schemas/Resume"
        sync_status:
          type: string
          enum: [synced, skipped, failed]
        sync_message:
          type: string

    UpdateResumeRequest:
      type: object
      properties:
        name:
          type: string
        is_base:
          type: boolean

    ResumeConfig:
      type: object
      required: [builder_configured, builder_url, api_key_configured, pdf_configured]
      properties:
        builder_configured:
          type: boolean
        builder_url:
          type: string
        api_key_configured:
          type: boolean
          description: Whether the current user has connected their RxResume API key
        pdf_configured:
          type: boolean

    RxResumeKeyStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean

    UserSettings:
      type: object
      properties:
        ai_provider:
          type: string
          nullable: true
          enum: [openai, anthropic, gemini, ollama]
        ai_model:
          type: string
          nullable: true
        writing_style:
          type: string
          nullable: true
          enum: [professional, conversational, formal]
        weekly_goal:
          type: integer
          nullable: true

    UpdateUserSettingsRequest:
      type: object
      properties:
        ai_provider:
          type: string
          nullable: true
        ai_model:
          type: string
          nullable: true
        writing_style:
          type: string
          nullable: true
        weekly_goal:
          type: integer
          nullable: true

    SetRxResumeKeyRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string

    Stats:
      type: object
      properties:
        total_jobs:
          type: integer
          format: int64
        by_status:
          type: object
          additionalProperties:
            type: integer
            format: int64
        follow_ups_due:
          type: integer
          format: int64

    JobAsset:
      type: object
      required: [id, user_id, job_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        job_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [cover_letter, interview_prep, ats_score, tailored_resume]
        content:
          type: string
        storage_key:
          type: string
        model_used:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GhostwriterMessage:
      type: object
      required: [id, user_id, job_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        job_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GhostwriterSendRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK

  /api/v1/jobs:
    get:
      summary: List jobs with filters and pagination
      parameters:
        - name: statuses
          in: query
          description: Comma-separated list of statuses to filter by
          schema:
            type: string
        - name: stage_ids
          in: query
          description: Comma-separated list of stage UUIDs to filter by
          schema:
            type: string
        - name: location_types
          in: query
          description: Comma-separated list of location types to filter by
          schema:
            type: string
        - name: sources
          in: query
          description: Comma-separated list of sources to filter by
          schema:
            type: string
        - name: job_types
          in: query
          description: Comma-separated list of job types to filter by
          schema:
            type: string
        - name: job_levels
          in: query
          description: Comma-separated list of job levels to filter by
          schema:
            type: string
        - name: tag_ids
          in: query
          description: Comma-separated list of tag UUIDs to filter by
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search in title, company name, location
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, title, applied_at, salary_min, deadline]
            default: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated list of jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/import:
    post:
      summary: Import a job from an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportJobRequest"
      responses:
        "201":
          description: Job imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/bulk:
    patch:
      summary: Bulk update or delete jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateRequest"
      responses:
        "200":
          description: Jobs updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected:
                    type: integer
                    format: int64
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/{id}:
    get:
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobRequest"
      responses:
        "200":
          description: Job updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Job deleted
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/{id}/activity:
    get:
      summary: Get activity log for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
